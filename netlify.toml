# การตั้งค่า deploy สำหรับ Netlify
[build]
  # generate client → สร้างตาราง (migrate) → สร้างบัญชีแอดมิน (seed, idempotent) → build
  command = "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npx next build"

[build.environment]
  NODE_VERSION = "22"

# ปลั๊กอินทางการของ Netlify สำหรับ Next.js (รองรับ App Router, Server Actions, middleware)
# Netlify จะติดตั้งให้อัตโนมัติ
[[plugins]]
  package = "@netlify/plugin-nextjs"
